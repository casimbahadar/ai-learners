const GLOSS = [
  ["Agent", "A setup where the AI decides its own steps toward a goal, using tools and checking results in a loop."],
  ["AI (artificial intelligence)", "Computers doing tasks that usually need human judgment."],
  ["AI assistant or chatbot", "An app you talk to in everyday language, built on a language model. Claude, ChatGPT, and Gemini are examples."],
  ["API", "A way for software to talk to an AI model directly. Developers use it to build AI into their own apps."],
  ["Bias", "Unfair patterns, like stereotypes, that a model can pick up from human-written training data."],
  ["CLAUDE.md and AGENTS.md", "Notes files that coding agents read at the start of a session. Claude Code reads CLAUDE.md; many other coding agents read AGENTS.md."],
  ["Connector", "A link between an assistant and another app, like email, a calendar, or file storage."],
  ["Context", "The background the AI needs to do a task well: who it's for, why, and what's already known."],
  ["Context window", "How much text the model can consider at once, including the conversation and any files. Anthropic calls it the model's working memory."],
  ["Custom GPT", "A saved, customized version of ChatGPT. OpenAI plans to retire custom GPTs in December 2026."],
  ["Custom instructions", "Standing instructions that apply to every chat. Claude calls these profile preferences."],
  ["Deep research", "A feature where the assistant runs many searches over several minutes and writes a cited report."],
  ["Deepfake", "A realistic fake image, video, or voice recording made with AI."],
  ["Evals", "A set of test inputs used to check how well a prompt or model performs."],
  ["Few-shot prompting", "Including a few examples in your prompt so the AI can match their style or format."],
  ["Fine-tuning", "Extra training on an already trained model. It's one of the ways a raw model becomes a helpful assistant."],
  ["Gem", "A saved, customized version of Gemini with its own instructions and optional files."],
  ["Generative AI", "AI that creates new content: text, images, audio, video, or code."],
  ["Hallucination", "A confident-sounding answer or detail that is made up or wrong."],
  ["Harness", "The software around a model that supplies its instructions, tools, and working loop."],
  ["Incognito or temporary chat", "A chat that isn't saved to your history. Claude calls it incognito; ChatGPT and Gemini call it Temporary Chat."],
  ["Knowledge cutoff", "The date a model's training data ends. It won't know later events unless it can search."],
  ["Large language model (LLM)", "An AI model trained on huge amounts of text to predict and produce language."],
  ["Machine learning", "Systems that learn patterns from examples instead of following hand-written rules."],
  ["MCP (Model Context Protocol)", "An open standard for connecting AI models to tools and data, introduced by Anthropic in November 2024."],
  ["Memory", "An optional feature that lets an assistant carry details from past chats into new ones."],
  ["Model", "The trained AI system that generates answers. The assistant app is built around it."],
  ["Multimodal", "Able to work with more than one kind of input or output, such as text, images, and audio."],
  ["Open-weight model", "A model whose trained parameters are published so anyone can download and run it."],
  ["Parameters", "The billions of internal numbers a model adjusts during training. They hold what it learned."],
  ["Pretraining", "The first stage of training, where a model learns to predict text from a very large dataset."],
  ["Project", "A workspace with its own instructions and files that chats inside it can use."],
  ["Prompt", "The message you send to an AI, including anything you attach or paste."],
  ["Prompt chaining", "Splitting a task into steps where each prompt builds on the last, like draft, critique, revise."],
  ["Prompt injection", "Instructions hidden in content an AI reads, such as a web page or email, written to hijack what it does."],
  ["Reasoning or thinking mode", "A mode where the model works through a problem before answering. Slower, better for hard tasks."],
  ["RLHF", "Reinforcement learning from human feedback: training a model using people's preferences between answers."],
  ["Role prompt", "Asking the AI to take a particular perspective, like \"you're an experienced editor.\""],
  ["Skill", "A folder with a SKILL.md file of instructions, and optional scripts or templates, that Claude loads only when a task matches its description."],
  ["Subagent", "A helper agent that a main agent hands part of a job to."],
  ["Sycophancy", "An AI's tendency to agree with the user or tell them what they want to hear, even when that's wrong."],
  ["System prompt", "Instructions an app gives the model before your conversation starts."],
  ["Temperature", "A setting for how much randomness goes into picking each word. Higher means more varied answers."],
  ["Token", "A small chunk of text, often a short word or part of one. Models read, write, and count usage in tokens."],
  ["Tool", "An ability the harness gives the model, like web search, running code, or creating files."],
  ["Vibe coding", "A term Andrej Karpathy coined in February 2025 for building software by describing it to an AI and accepting the code without reviewing it."],
  ["Workflow", "A setup where the steps are set in advance and the AI carries out each one."]
];

/* ---------- prompt checker (runs locally, no AI) ---------- */
const TEMPLATE = "Task: \nContext (who it's for, why, background): \nExample of what good looks like: \nFormat (length, structure, tone): \nLimits (must include or avoid): ";
const RULES = {
  task: /\b(write|draft|summari[sz]e|explain|list|plan|create|make|give|rewrite|translate|suggest|analy[sz]e|fix|review|find|design|brainstorm|compare|help|teach|quiz|outline|edit|proofread|recommend|calculate|convert|generate|describe|organi[sz]e|prepare|build|check|tell|show|turn|research|critique)\b/,
  context: /\b(i'm|i am|i've|i have|my|we're|we are|our|because|so that|since|audience|background|for (a|an|my|our)\b|who (is|are)|currently|i work|i live)/,
  examples: /(for example|e\.g\.|such as|like this|here'?s (an?|one|my|the)|example|<example>|in the style of|"[^"]{10,}")/,
  format: /(\b\d+\s*(words?|sentences?|paragraphs?|bullets?|bullet points?|points?|items?|steps?|lines?|minutes?|pages?)\b|\bbullet|\btable\b|\blist\b|\bparagraph|\bshort\b|\bbrief\b|\bconcise|\bdetailed\b|\btone\b|\bformal\b|\bcasual\b|\bfriendly\b|\bprofessional\b|\bheadings?\b|subject line|\bformat\b|step[- ]by[- ]step|\bunder \d+|\bno more than\b)/,
  limits: /\b(don'?t|do not|avoid|must|only|without|never|make sure|include|exclude|at least|at most|stick to|limit|keep it|no \w+)\b/
};
const MISSING = {
  task: ["What exactly should it produce: an email, a list, a plan, an explanation?", "Start with a clear verb like write, summarize, compare, or plan."],
  context: ["Who is this for, and why do you need it?", "What background would a stranger need to do this well?"],
  examples: ["Do you have a sample of the style or result you want?", "Skip this if style doesn't matter for this task."],
  format: ["How long should it be, and what shape: paragraphs, bullets, a table?", "What tone: formal, friendly, funny, direct?"],
  limits: ["Is there anything it must include?", "Anything it should avoid, like inventing facts or using jargon?"]
};
function analyze(text){
  const t = text.toLowerCase();
  const words = (text.match(/\S+/g) || []).length;
  const found = {};
  PARTS.forEach(p => { const m = t.match(RULES[p]); found[p] = m ? m[0] : null; });
  if (!found.task && /\?\s*$/.test(text.trim())) found.task = "a question";
  if (found.context && words < 10) found.context = null;
  const flags = [];
  if (words < 8) flags.push("Very short. Short prompts leave most choices to the AI. That's fine for a quick question, but not for anything you care about.");
  if (/\b(good|better|nice|interesting|some stuff|things|etc)\b/.test(t) && words < 40) flags.push("Words like \"good,\" \"better,\" or \"things\" are vague. Say what good means for this task.");
  if (/\bcan you suggest\b|\bany suggestions\b/.test(t)) flags.push("\"Can you suggest\" may get you suggestions rather than a finished result. If you want it done, say \"rewrite\" or \"make these changes.\"");
  if (/[A-Z]{6,}/.test(text) && /\b(MUST|NEVER|ALWAYS|IMPORTANT)\b/.test(text)) flags.push("You don't need capitals to be heard. A calm instruction with a reason usually works better.");
  if (/\b(\d[ -]?){13,19}\b/.test(text) || /\bpassword\b|\bpin\b|\bsocial security\b|\bsin number\b/.test(t) || /\b\d{3}-\d{2}-\d{4}\b/.test(text)) flags.push("This looks like it may contain a card number, password, or ID number. Replace it with a placeholder like [CARD ENDING 1234] before sending.");
  return {found, flags, words};
}
function renderAnalysis(text, target){
  const {found, flags, words} = analyze(text);

  const missing = PARTS.filter(p => !found[p]);
  let html = `<h3>${have.length} of 5 parts spotted</h3><div class="chips">${PARTS.map(p => `<span class="chip ${p} ${found[p] ? "yes" : ""}">${PART_NAMES[p]}: ${found[p] ? "spotted" : "not found"}</span>`).join("")}</div>`;
  if (have.length) html += `<p class="small muted">Spotted from words like: ${have.map(p => `<b>${esc(found[p])}</b> (${PART_NAMES[p].toLowerCase()})`).join(", ")}.</p>`;
  if (flags.length) html += `<h4>Worth a look</h4><ul class="plain">${flags.map(f => `<li>${esc(f)}</li>`).join("")}</ul>`;
  if (missing.length) {
    html += `<h4>Questions to answer in your prompt</h4><ul class="plain">${missing.map(p => `<li><span class="m ${p}">${PART_NAMES[p]}</span> ${esc(MISSING[p][0])} <span class="muted">${esc(MISSING[p][1])}</span></li>`).join("")}</ul>`;
    const scaffold = text.trim() + "\n\n" + missing.map(p => ({task:"Task: [what you want produced]",context:"Context: [who it's for, why, and any background]",examples:"Example: [a sample of the style or result you want, if it matters]",format:"Format: [length, structure, and tone]",limits:"Limits: [anything it must include or avoid]"})[p]).join("\n");
    html += `<figure class="pblock"><figcaption class="plabel">Your prompt with the missing parts added. Fill in the brackets, and delete any line that doesn't apply.</figcaption><pre class="prompt" id="scaffold">${esc(scaffold)}</pre><div class="pactions"><button class="link-btn" id="useScaffold">Put this in the editor</button><button class="link-btn" data-copy>Copy</button></div></figure>`;
  } else {
    html += `<p><b class="ok">Nice.</b> Every part is there. Paste it into your assistant and see how the answer compares to a shorter version.</p>`;
  }
  html += `<p class="small muted">${words} words. This checker runs in your browser and looks for common signs of each part. It doesn't understand meaning, so treat it as a nudge, not a grade. You don't always need all five.</p>`;
  target.innerHTML = html;
  bindCopy(target);

function roughTokens(text){
  const parts = text.match(/\s*[A-Za-z]+|\s*\d{1,3}|\s*[^\sA-Za-z\d]/g) || [];
  const out = [];
  parts.forEach(p => {
    const lead = p.match(/^\s*/)[0], core = p.slice(lead.length);
    if (/^[A-Za-z]+$/.test(core) && core.length > 7) {
      const chunks = core.match(/.{1,5}/g);
      chunks.forEach((c, i) => out.push((i === 0 ? lead : "") + c));
    } else out.push(p);
  });
  return out;
}

function copyText(text, btn){
  const label = btn ? btn.textContent : "";
  const ok = () => { if (btn){ btn.textContent = "Copied"; setTimeout(() => { btn.textContent = label; }, 1600); } };
  const fallback = () => {
    const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly",""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    let done = false; try { done = document.execCommand("copy"); } catch(e){}
    document.body.removeChild(ta);
    if (done) ok(); else if (btn) { btn.textContent = "Select the text to copy"; setTimeout(() => { btn.textContent = label; }, 2400); }
  };
  try { if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(ok, fallback); else fallback(); } catch(e){ fallback(); }
}

  const lessonOk = m && LESSONS[+m[1]-1];
  if (lessonOk) main.innerHTML = pageLesson(+m[1]);
  else if (PAGES[h]) main.innerHTML = PAGES[h][0]();
  else { h = "home"; main.innerHTML = pageHome(); }
  renderNav(h);
  closeNav();
  $$('[data-widget="tf"]', main).forEach(mountTF);
  $$('[data-widget="builder"]', main).forEach(mountBuilder);
  $$('[data-widget="loop"]', main).forEach(mountLoop);
  $$('[data-widget="nextword"]', main).forEach(mountNextWord);
  $$('[data-widget="tokens"]', main).forEach(mountTokens);
  bindCopy(main);
  if (h === "home") mountHome();
  if (PAGES[h] && PAGES[h][1]) PAGES[h][1]();
  if (lessonOk) {
    const box = $("#doneBox"), idx = +m[1]-1;
    box.addEventListener("change", () => { setDone(LESSONS[idx].id, box.checked); renderNav(h); });
  }
  window.scrollTo(0, 0);
  const t = $("#pageTitle");
  if (t && started) { t.setAttribute("tabindex","-1"); t.focus({preventScroll:true}); }
  started = true;
  document.title = (t ? t.textContent + " | " : "") + APP_NAME;
}
function openNav(){ $("#side").classList.add("open"); $("#menuBtn").setAttribute("aria-expanded","true"); $("#closeBtn").focus(); }
function closeNav(){ $("#side").classList.remove("open"); $("#menuBtn").setAttribute("aria-expanded","false"); }
$("#menuBtn").addEventListener("click", openNav);
$("#closeBtn").addEventListener("click", () => { closeNav(); $("#menuBtn").focus(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#side").classList.contains("open")) { closeNav(); $("#menuBtn").focus(); } });
window.addEventListener("hashchange", route);
route();
})();

</script>
</body>
</html>
